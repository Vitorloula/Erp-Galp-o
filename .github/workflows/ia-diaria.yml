name: 🤖 Fábrica Autônoma Full-Stack

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Impede duas execuções simultâneas (se uma estiver rodando, a outra espera)
concurrency:
  group: fabrica-autonoma
  cancel-in-progress: false

jobs:
  evoluir-erp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - name: 🟩 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Instalar Dependências
        run: |
          npm ci
          pip install -r agents/requirements.txt

      - name: 🪪 Configurar o Git
        run: |
          git config --global user.name "Robô ERP Galpão"
          git config --global user.email "robo@erpgalpao.com"

      - name: 🏗️ Executar a Fábrica Autônoma
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Se usar DeepSeek (ou outro endpoint OpenAI-compatível), adicione os
          # secrets OPENAI_API_BASE e OPENAI_MODEL_NAME abaixo:
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL_NAME: ${{ secrets.OPENAI_MODEL_NAME }}
          # Modelo por papel (opcional): LLM_MODEL, LLM_MODEL_ARQUITETO, LLM_MODEL_PO...
          MAX_CICLOS: '2'
          AGENT_MAX_ITER: '12'
        run: python agents/main.py

      # Usa exatamente o mesmo comando do testes.yml (Edge pré-instalado no Windows)
      - name: 🧪 Testes de ponta a ponta (Playwright + Edge)
        if: success()
        run: npm run test:e2e

      - name: 📎 Relatório dos testes de ponta a ponta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: 🚀 Criar Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $BRANCH = (git branch -r --sort=-committerdate | Select-String 'ia-autonoma/' | Select-Object -First 1).ToString().Trim() -replace 'origin/', ''
          if ($BRANCH) {
            gh pr create --title "🤖 Evolução IA: $(Get-Date -Format 'dd/MM/yyyy')" --body "PR gerado automaticamente. E2E aprovado no Edge." --base main --head $BRANCH
          } else {
            echo "⚠️ Nenhuma branch nova encontrada."
          }

      - name: 📧 Enviar E-mail de Alerta
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 ERRO: Fábrica Autônoma falhou hoje"
          to: ${{ secrets.MAIL_TO }}
          from: "Robô ERP Galpão"
          body: |
            A execução da fábrica autônoma falhou.
            Acesse os logs completos aqui:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}