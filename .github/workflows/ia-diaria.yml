name: 🤖 Fábrica Autônoma Full-Stack

on:
  schedule:
    - cron: '0 3 * * *' 
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  evoluir-erp:
    # MUDANÇA AQUI: Forçando Windows, já que seu log mostrou runneradmin
    runs-on: windows-latest 

    steps:
      - name: 📥 Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🟩 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar Dependências
        run: |
          npm ci
          pip install -r agents/requirements.txt

      - name: 🪪 Configurar o Git
        run: |
          git config --global user.name "Robô ERP Galpão"
          git config --global user.email "robo@erpgalpao.com"

      # --- A IA TRABALHA AQUI ---
      - name: 🏗️ Executar a Fábrica Autônoma
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_CICLOS: '2' 
        run: python agents/main.py

      # --- O SEGREDO PARA O E2E FUNCIONAR ---
      - name: 🎭 Instalar Navegadores do Playwright
        if: success()
        # No Windows, NÃO usar --with-deps. Apenas instalar o Chromium.
        run: npx playwright install chromium 

      - name: 🧪 Rodar Testes E2E
        if: success()
        env:
          CI: 'true'
        run: npx playwright test

      # --- SE TUDO PASSAR, CRIA O PR ---
      - name: 🚀 Criar Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $BRANCH = git branch -r --sort=-committerdate | Select-String 'ia-autonoma/' | Select-Object -First 1
          if ($BRANCH) {
            $BRANCH = $BRANCH.ToString().Trim() -replace 'origin/', ''
            gh pr create --title "🤖 Evolução IA: $(Get-Date -Format 'dd/MM/yyyy')" --body "PR gerado automaticamente. E2E aprovado." --base saas --head $BRANCH
          } else {
            echo "⚠️ Nenhuma branch nova encontrada."
          }

      # --- SE FALHAR, ENVIA E-MAIL ---
      - name: 📧 Enviar E-mail de Alerta
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 ERRO: Fábrica Autônoma falhou hoje"
          to: ${{ secrets.MAIL_TO }}
          from: "Robô ERP Galpão"
          body: |
            A execução da fábrica autônoma falhou. 
            Acesse os logs completos aqui:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}